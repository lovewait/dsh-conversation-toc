# dsh-conversation-toc bundle patch: inserts the client-only plugin row into the
# profile roster. The node half (exports ".") is a no-op; the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: ui-conversation-toc
      name: 'dsh-conversation-toc'
